    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="description" content="LET'S BUILD — Premium E-Commerce Template Showcase. Choose your storefront design from multiple professionally crafted templates." />
    <meta property="og:title" content="LET'S BUILD — E-Commerce Templates" />
    <meta property="og:description" content="One powerful e-commerce foundation. Multiple design directions." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <title>LET'S BUILD — E-Commerce Templates</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        function removeNetlifyBadges() {
          var selectors = [
            'iframe[src*="netlify"]',
            'iframe[id*="netlify"]',
            '[data-netlify-badge]',
            '#netlify-badge',
            '.netlify-badge',
            '[id*="netlify-drawer"]',
            '[class*="netlify-drawer"]',
            '[data-netlify-drawer]',
            'netlify-drawer',
            'netlify-badge'
          ];
          for (var i = 0; i < selectors.length; i++) {
            var els = document.querySelectorAll(selectors[i]);
            for (var j = 0; j < els.length; j++) {
              els[j].remove();
            }
          }
        }
        removeNetlifyBadges();
        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver(removeNetlifyBadges).observe(document.documentElement, {
            childList: true,
            subtree: true
          });
        }
        window.addEventListener('DOMContentLoaded', removeNetlifyBadges);
        window.addEventListener('load', removeNetlifyBadges);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
